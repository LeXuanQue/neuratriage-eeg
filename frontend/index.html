<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>NeuraTriage EEG — Stroke Early Warning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles/tokens.css">
<style>
  html, body, #root { height: 100%; }
  body { background: #0c0e12; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="lib/i18n.js"></script>
<script type="text/babel" data-presets="react" src="components/design-canvas.jsx"></script>
<script type="text/babel" data-presets="react" src="components/eeg-waveform.jsx"></script>
<script type="text/babel" data-presets="react" src="components/visualizations.jsx"></script>
<script type="text/babel" data-presets="react" src="components/app-shell.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/live-monitor-a.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/live-monitor-b.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/live-monitor-c.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/other-screens.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/device-screen.jsx"></script>
<script type="text/babel" data-presets="react" src="screens/login-screen.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
window.useM2 = React.useMemo;

const STORAGE_KEY = "neuratriage_auth";
const LANG_KEY = "neuratriage_lang";
const MODE_KEY = "neuratriage_mode";

function loadUser() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function saveUser(u) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(u)); } catch (e) {} }
function clearUser() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
function loadLang() { try { return localStorage.getItem(LANG_KEY) || "vi"; } catch (e) { return "vi"; } }
function saveLang(l) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
function loadMode() { try { return localStorage.getItem(MODE_KEY) || "HS"; } catch (e) { return "HS"; } }
function saveMode(m) { try { localStorage.setItem(MODE_KEY, m); } catch (e) {} }

function AppFrame({variant, lang, channels, mode, defaultScreen = "live", onLang}) {
  const [active, setActive] = useState(defaultScreen);
  const t = window.I18N[lang];

  const LiveCmp = variant === "B" ? window.LiveMonitorB
                : variant === "C" ? window.LiveMonitorC
                : window.LiveMonitorA;

  let screen;
  if (active === "live") screen = <LiveCmp mode={mode} channels={channels} />;
  else if (active === "dashboard") screen = <window.DashboardScreen />;
  else if (active === "patient") screen = <window.PatientScreen channels={channels} />;
  else if (active === "alerts") screen = <window.AlertReviewScreen channels={channels} />;
  else if (active === "device") screen = <window.DeviceScreen />;
  else if (active === "setup") screen = <window.SetupScreen channels={channels} />;
  else if (active === "insights") screen = <window.InsightsScreen channels={channels} />;
  else if (active === "reports") screen = <window.ReportsScreen />;
  else if (active === "settings") screen = <window.SettingsScreen />;

  return (
    <window.AppContext.Provider value={{lang, t}}>
      <window.AppShell active={active} onNav={setActive} lang={lang} onLang={onLang}>
        {screen}
      </window.AppShell>
    </window.AppContext.Provider>
  );
}

function DemoControls({variant, mode, lang, onVariant, onMode, onSignOut}) {
  const labels = lang === "vi"
    ? {layout: "Bố cục", mode: "Tình huống", out: "Đăng xuất"}
    : {layout: "Layout", mode: "Scenario", out: "Sign out"};
  const cellStyle = {
    padding: "5px 9px", borderRadius: 6, border: "1px solid var(--line)",
    background: "var(--bg)", fontSize: 11, cursor: "pointer", color: "var(--ink-2)",
    fontFamily: "inherit",
  };
  const activeCell = {...cellStyle, background: "var(--ink)", color: "var(--bg)", borderColor: "var(--ink)"};
  return (
    <div style={{
      position: "fixed", top: 12, right: 14, zIndex: 50,
      display: "flex", alignItems: "center", gap: 10, padding: "6px 8px",
      background: "var(--bg)", border: "1px solid var(--line)",
      borderRadius: 999, boxShadow: "var(--shadow-2)", fontSize: 11,
    }}>
      <span style={{color: "var(--ink-3)", letterSpacing: "0.06em", textTransform: "uppercase", marginLeft: 4}}>
        {labels.layout}
      </span>
      {["A", "B", "C"].map(v => (
        <button key={v} style={v === variant ? activeCell : cellStyle} onClick={() => onVariant(v)}>{v}</button>
      ))}
      <span style={{width: 1, height: 16, background: "var(--line)"}}/>
      <span style={{color: "var(--ink-3)", letterSpacing: "0.06em", textTransform: "uppercase"}}>
        {labels.mode}
      </span>
      {["NS", "IS", "HS"].map(m => (
        <button key={m} style={m === mode ? activeCell : cellStyle} onClick={() => onMode(m)}>{m}</button>
      ))}
      <span style={{width: 1, height: 16, background: "var(--line)"}}/>
      <button style={cellStyle} onClick={onSignOut}>{labels.out}</button>
    </div>
  );
}

function Root() {
  const [user, setUserState] = useState(loadUser());
  const [lang, setLangState] = useState(loadLang());
  const [mode, setModeState] = useState(loadMode());
  const channels19 = useMemo(() => window.pickChannels(19), []);

  function setLang(next) { setLangState(next); saveLang(next); }
  function setMode(next) { setModeState(next); saveMode(next); }
  function setVariant(next) {
    if (!user) return;
    const updated = {...user, variant: next};
    setUserState(updated);
    saveUser(updated);
  }
  function handleLogin(u) { saveUser(u); setUserState(u); }
  function handleSignOut() { clearUser(); setUserState(null); }

  if (!user) {
    return (
      <window.LoginScreen
        lang={lang}
        onLang={setLang}
        onLogin={handleLogin}
      />
    );
  }

  return (
    <React.Fragment>
      <AppFrame
        variant={user.variant || "A"}
        lang={lang}
        channels={channels19}
        mode={mode}
        onLang={setLang}
      />
      <DemoControls
        variant={user.variant || "A"}
        mode={mode}
        lang={lang}
        onVariant={setVariant}
        onMode={setMode}
        onSignOut={handleSignOut}
      />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
